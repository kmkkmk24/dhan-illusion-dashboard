# Alembic config. Migrations live in backend/migrations; the database is the
# app's own (backend.config.get_db_path), so no URL is set here.
#
#   New migration after changing backend/models/tables.py:
#     .venv\Scripts\alembic revision --autogenerate -m "add xyz column"
#   Apply (the app also does this automatically at startup):
#     .venv\Scripts\alembic upgrade head
#   Against another file:   alembic -x db=path\to\other.db upgrade head

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
